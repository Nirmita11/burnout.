services:
  - type: web
    name: burnout-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.16
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
